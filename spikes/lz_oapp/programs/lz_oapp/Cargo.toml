[package]
name = "lz_oapp"
version = "0.1.0"
description = "Tesoro spike S2/S3: LayerZero V2 OApp carrying Position messages"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lz_oapp"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "oapp/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
oapp = { package = "oapp-latest", git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "c09287a" }
