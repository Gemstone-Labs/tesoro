[workspace]
members = ["programs/*", "crates/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# Smaller binary: the upgrade buffer costs the full rent of the program.
[profile.release.package.trading_duel]
opt-level = "s"
