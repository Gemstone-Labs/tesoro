[package]
name = "tesoro_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tesoro_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sim_lst/idl-build"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "0.31.1"
sim_lst = { path = "../sim_lst", features = ["cpi"] }
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }

[dev-dependencies]
litesvm = "=0.11.0"
proptest = "1.11.0"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
solana-sdk = "3.0.0"
