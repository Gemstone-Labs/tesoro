[package]
name = "tesoro_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tesoro_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "sim_lst/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
sim_lst = { path = "../sim_lst", features = ["cpi"] }

[dev-dependencies]
litesvm = "=0.11.0"
proptest = "1.11.0"
solana-sdk = "3.0.0"
