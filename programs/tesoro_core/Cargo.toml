[package]
name = "tesoro_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tesoro_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

[dev-dependencies]
litesvm = "0.17.0"
proptest = "1.11.0"
solana-address = "2.7.0"
solana-clock = "4.0.0"
solana-instruction = "3.5.1"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"
