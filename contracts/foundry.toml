[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Every call runs as its own transaction, as on the chain: storage is cold and gas is what the chain charges.
isolate = true
# CodeSize.t.sol reads the build artifacts to check the EIP-170 limit.
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../bridge/evm-receive.json" }]

[rpc_endpoints]
hoodi = "${HOODI_RPC_URL}"
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"
# Ethereum mainnet (chain id 1). Read-only use here: fork tests. Deploys are the orchestrator's.
ethereum = "${ETH_MAINNET_RPC}"
# HyperEVM mainnet (chain id 999). Fork tests; deploys are the orchestrator's and need big blocks.
hyperevm = "${HYPEREVM_MAINNET_RPC}"

[invariant]
runs = 128
depth = 128
fail_on_revert = false

[profile.deep.invariant]
runs = 256
depth = 128
fail_on_revert = false

[fuzz]
runs = 256
